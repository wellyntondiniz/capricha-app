server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite upload de imagens de eventos (até 15MB)
    client_max_body_size 15M;

    # Proxy reverso para a API Spring Boot (remove o prefixo /api ao encaminhar)
    location /api/ {
        proxy_pass http://capricha-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy direto para imagens salvas no backend (/imagens/eventos/..., /imagens/usuarios/...)
    location /imagens/ {
        proxy_pass http://capricha-api:8080/imagens/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Manifesto e Service Worker do PWA sem cache agressivo
    location ~* ^/(manifest\.json|sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Rotas do Expo Router (SPA / Static Export)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
